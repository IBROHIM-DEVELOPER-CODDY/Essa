<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESSA Parfume — 3D katalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Jost","Helvetica Neue",Arial,sans-serif;
  --g1:#f6dc9b; --g2:#cf9f45; --g3:#8c5f1f;
  --gold:linear-gradient(120deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 70%,var(--g2) 100%);
}
:root[data-theme="dark"]{--bg:#0a0807;--bg2:#15100b;--fg:#f5ecdc;--mut:#ad9e85;--line:rgba(214,172,92,.22);--panel:#17110b;--glow:rgba(214,160,70,.24);--chip:rgba(214,172,92,.1);--head:rgba(10,8,7,.9)}
:root[data-theme="light"]{--bg:#f8f2e7;--bg2:#efe5d1;--fg:#1d160c;--mut:#6e5e44;--line:rgba(140,98,28,.28);--panel:#fffaf0;--glow:rgba(205,150,55,.3);--chip:rgba(160,110,30,.1);--head:rgba(248,242,231,.92);--g1:#dcae55;--g2:#a9761f;--g3:#6b4510}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{font-family:var(--sans);color:var(--fg);background:linear-gradient(180deg,var(--bg),var(--bg2) 60%,var(--bg));min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.modal-open{overflow:hidden}
.vc{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,4vw,48px);background:var(--head);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg)}
.brand svg{width:38px;height:38px}
.brand b{font:600 22px/1 var(--serif);letter-spacing:.22em}
.brand small{display:block;font:400 9px/1 var(--sans);letter-spacing:.5em;color:var(--mut);margin-top:5px}
nav{display:flex;gap:26px}
nav a{color:var(--fg);text-decoration:none;font-size:14px;opacity:.8;position:relative;padding:6px 0;transition:opacity .3s}
nav a:hover{opacity:1}
nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .35s}
nav a:hover::after{transform:scaleX(1)}
.tools{display:flex;gap:10px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--chip)}
.seg button{border:0;background:none;color:var(--mut);font:500 12px var(--sans);padding:6px 11px;border-radius:99px;cursor:pointer;transition:background .3s,color .3s}
.seg button.on{background:var(--gold);color:#1b1206}
.themeBtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.themeBtn svg{width:18px;height:18px}
[data-theme="dark"] .sun{display:block}[data-theme="dark"] .moon{display:none}
[data-theme="light"] .sun{display:none}[data-theme="light"] .moon{display:block}

.hero{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:2vw;padding:110px clamp(18px,5vw,72px) 40px}
.hero h1{font:600 clamp(46px,7.4vw,108px)/.95 var(--serif);letter-spacing:-.01em}
.hero h1 span{display:block}
.shine{background:var(--gold);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.hero p{margin-top:26px;max-width:46ch;color:var(--mut);font-size:17px;line-height:1.65;font-weight:300}
.cta{display:inline-flex;margin-top:34px;padding:15px 32px;border-radius:99px;background:var(--gold);color:#1b1206;text-decoration:none;font:500 15px var(--sans);transition:transform .3s}
.cta:hover{transform:translateY(-3px)}
.heroView{position:relative;height:min(76vh,700px);min-height:400px;touch-action:pan-y;cursor:grab;background:radial-gradient(closest-side at 50% 58%,var(--glow),transparent 74%)}
.heroCap{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font:italic 500 22px var(--serif);pointer-events:none}
.heroCap small{display:block;font:300 12px var(--sans);color:var(--mut);margin-top:4px;font-style:normal}

.marquee{border-block:1px solid var(--line);overflow:hidden;padding:18px 0;background:var(--chip)}
.marquee div{display:flex;gap:56px;width:max-content;animation:mq 50s linear infinite;font:italic 500 26px var(--serif);color:var(--mut);will-change:transform}
.marquee i{color:var(--g2);font-style:normal}
@keyframes mq{to{transform:translate3d(-50%,0,0)}}

section{padding:clamp(60px,9vw,120px) clamp(16px,5vw,72px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.head h2{font:600 clamp(34px,5vw,64px)/1 var(--serif)}
.head p{color:var(--mut);margin-top:10px;font-weight:300}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--chip);color:var(--fg);font:400 13px var(--sans);padding:8px 16px;border-radius:99px;cursor:pointer;transition:border-color .3s}
.chips button:hover{border-color:var(--g2)}
.chips button.on{background:var(--gold);color:#1b1206;border-color:transparent}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.card{position:relative;border-radius:30px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;background:var(--panel);transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .35s}
.card:hover{transform:translate3d(0,-6px,0);border-color:var(--g2)}
.card.hide{display:none}
.view{position:relative;aspect-ratio:4/4.5;touch-action:pan-y;cursor:grab;
  background:radial-gradient(closest-side at 50% 64%,var(--glow),transparent 78%)}
.view:active{cursor:grabbing}
.tag{position:absolute;top:16px;left:18px;font:italic 500 18px var(--serif);color:var(--g2);z-index:2}
.drag{position:absolute;top:18px;right:18px;font-size:11px;color:var(--mut);z-index:2}
.info{padding:22px 22px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px;flex:1}
.info em{font:italic 500 16px var(--serif);color:var(--g2)}
.info h3{font:600 30px/1.05 var(--serif);margin-top:2px}
.notes{display:grid;gap:9px}
.notes div{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline;font-size:13px}
.notes dt{color:var(--mut);font-weight:300}
.notes dd{display:flex;flex-wrap:wrap;gap:5px}
.notes span{background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:300 12px var(--sans);color:var(--mut);text-align:left;padding-bottom:6px}
td{padding:8px 0;border-top:1px solid var(--line)}
td:last-child,th:last-child{text-align:right}
td:last-child{font:600 19px var(--serif);color:var(--g2)}

.search{position:relative;max-width:420px;width:100%}
.search input{width:100%;padding:14px 20px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:400 15px var(--sans);outline:none}
.search input:focus{border-color:var(--g2)}
.count{color:var(--mut);font-size:13px;margin:0 0 18px;min-height:1em}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:0 28px}
.list button{display:flex;gap:12px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);padding:11px 4px;font:400 14px var(--sans);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 44px}
.list button b{font:italic 600 15px var(--serif);color:var(--g2);min-width:34px}
.list button span{transition:transform .3s,color .3s}
.list button:hover span{transform:translate3d(8px,0,0);color:var(--g2)}
.none{padding:40px 0;color:var(--mut)}

.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 90%,transparent)}
.modal.open{display:grid;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(920px,94vw);max-height:92vh;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:34px;overflow:hidden;background:var(--panel)}
.mview{position:relative;min-height:420px;touch-action:pan-y;cursor:grab;background:radial-gradient(closest-side at 50% 60%,var(--glow),transparent 78%)}
.mtext{padding:36px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.mtext em{font:italic 600 26px var(--serif);color:var(--g2)}
.mtext h3{font:600 clamp(28px,4vw,42px)/1.05 var(--serif)}
.mtext p{color:var(--mut);line-height:1.6;font-weight:300}
.mtext a{color:var(--fg);font:600 26px var(--serif);text-decoration:none}
.close{position:absolute;top:18px;right:18px;z-index:130;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:22px;cursor:pointer}

footer{border-top:1px solid var(--line);padding:56px clamp(16px,5vw,72px) 70px;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;background:var(--chip)}
footer h4{font:600 34px var(--serif)}
footer p{color:var(--mut);margin-top:8px;font-weight:300}
footer .links{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
footer a{color:var(--fg);text-decoration:none;font-size:18px;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--g2)}
:focus-visible{outline:2px solid var(--g2);outline-offset:3px}
@media (max-width:860px){
  nav{display:none}
  .hero{grid-template-columns:1fr;padding-top:96px}
  .heroView{height:58vh}
  .mbox{grid-template-columns:1fr;overflow:auto}
  .mview{min-height:320px;height:42vh}
  footer{grid-template-columns:1fr}
  .brand small{display:none}
}
@media (max-width:520px){.seg button{padding:6px 8px}.brand b{font-size:18px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:34px}.row .cta{margin-top:0}
.ghost{display:inline-flex;gap:8px;align-items:center;padding:14px 26px;border-radius:99px;border:1px solid var(--g2);background:transparent;color:var(--fg);font:500 15px var(--sans);cursor:pointer;transition:background .3s,color .3s}
.ghost:hover{background:var(--gold);color:#1b1206;border-color:transparent}
.ghost svg,.sprayBtn svg{width:18px;height:18px}
.vwrap{position:relative}
.sprayBtn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;display:inline-flex;gap:8px;align-items:center;padding:9px 18px;border-radius:99px;border:1px solid var(--g2);background:var(--panel);color:var(--fg);font:500 13px var(--sans);cursor:pointer;white-space:nowrap;transition:background .3s,color .3s}
.sprayBtn:hover,.sprayBtn:active{background:var(--gold);color:#1b1206;border-color:transparent}
.view::before,.heroView::before,.mview::before{content:"";position:absolute;inset:0;background:radial-gradient(closest-side at 50% 38%,var(--ac,transparent),transparent 80%);opacity:0;transition:opacity .7s;pointer-events:none}
.sprayed::before{opacity:1}
.fxname{position:absolute;left:50%;top:46px;transform:translateX(-50%);font:italic 600 22px var(--serif);color:var(--g2);opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap;z-index:2}
.fxname.show{opacity:1}
.desc{font:400 14.5px/1.55 var(--sans);opacity:.92}
.orig{font-size:13px;color:var(--mut);line-height:1.55;border-left:2px solid var(--g2);padding-left:11px}
.orig b{display:block;font:italic 600 15px var(--serif);color:var(--g2)}
.notes span{transition:box-shadow .7s,border-color .7s,background .7s}
.notes dt{transition:color .7s}
.notes div.lit span{border-color:var(--g2);box-shadow:0 0 14px var(--glow);background:var(--chip)}
.notes div.lit dt{color:var(--g2)}
.themeBtn.off .wave{display:none}.themeBtn.off .slash{display:block!important}
.mtext .orig{margin-top:2px}
</style>
</head>

function makeGroup(spec){
  const b=build(spec);const box=new THREE.Box3().setFromObject(b);const h=box.max.y-box.min.y;
  b.position.y=-(box.min.y+box.max.y)/2;const w=new THREE.Group();w.add(b);w.userData.base=2.35/h;w.visible=false;scene.add(w);return w}
function getGroup(spec,keep=true){
  if(keep&&cache.has(spec))return cache.get(spec);
  const g=makeGroup(spec);if(keep)cache.set(spec,g);return g}
function warm(spec){ /* upload textures + compile shaders ahead of time, off-screen */
  const g=getGroup(spec);if(g.userData.warm)return;g.userData.warm=1;g.visible=true;

function sizeView(v){
  const r=v.el.getBoundingClientRect();if(r.width<2||r.height<2)return;
  const dpr=Math.min(devicePixelRatio||1,v.opt.hero?2:1.6);
  let w=r.width*dpr,h=r.height*dpr;const m=Math.min(1,GW/Math.max(w,h));w=Math.round(w*m);h=Math.round(h*m);
  if(v.cv.width!==w||v.cv.height!==h){v.cv.width=w;v.cv.height=h}v.pw=w;v.ph=h}
function mkView(el,spec,opt={}){
  const cv=document.createElement("canvas");cv.className="vc";el.prepend(cv);
  const v={el,cv,ctx:cv.getContext("2d"),spec,opt,vis:false,rot:Math.random()*6,vel:.55,hx:0,hy:0,sm:0,smy:0,app:0,group:null,base:1,leaving:false,pw:0,ph:0,drag:false,fx:null,pump:0,lab:null,tm:0};
  v.ro=new ResizeObserver(()=>sizeView(v));v.ro.observe(el);
  v.io=new IntersectionObserver(es=>{v.vis=es[es.length-1].isIntersecting;if(v.vis&&!v.group){v.group=getGroup(v.spec,!opt.nocache);v.base=v.group.userData.base;v.app=0}},{rootMargin:"150px"});v.io.observe(el);
  v.lab=document.createElement("span");v.lab.className="fxname";el.appendChild(v.lab);sizeView(v);attach(v);VIEWS.add(v);return v}
function destroyView(v){v.io.disconnect();v.ro.disconnect();VIEWS.delete(v);v.cv.remove();
  if(v.opt.nocache&&v.group){scene.remove(v.group);disposeObj(v.group)}}
function attach(v){
  const el=v.el;let lt=0,lx=0,sx=0,sy=0,st=0,moved=0;
  el.addEventListener("pointerdown",e=>{v.drag=true;lx=sx=e.clientX;sy=e.clientY;lt=st=performance.now();moved=0;v.vel=0;try{el.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener("pointermove",e=>{
    const r=el.getBoundingClientRect();v.hx=(e.clientX-r.left)/r.width-.5;v.hy=(e.clientY-r.top)/r.height-.5;
    if(v.drag){const n=performance.now(),dx=(e.clientX-lx)*.012;v.rot+=dx;moved=Math.max(moved,Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy));
      v.vel=Math.max(-14,Math.min(14,dx/Math.max(.008,(n-lt)/1000)));lx=e.clientX;lt=n}});

  el.addEventListener("pointercancel",()=>{v.drag=false});
  el.addEventListener("pointerleave",()=>{v.hx=0;v.hy=0});
}

function pick(k){let r=Math.random(),s=0;for(const[n,w]of k){s+=w;if(r<=s)return n}return k[0][0]}
function spawn(v,light){
  const f=v.fx,st=f.st,sc=v.pw/360,w=v.pw,h=v.ph,k=pick(st.k);
  let col=st.col[(Math.random()*st.col.length)|0];
  if(light&&bright(col)>205)col="#cbb98e";
  let x=w*.5,y=h*.22,a,sp=st.spd*sc*(.45+Math.random()*.8);
  switch(st.d){
    case"R":a=-.5+(Math.random()-.5)*.9;break;
    case"L":a=Math.PI+.5+(Math.random()-.5)*.9;break;
    case"U":a=-Math.PI/2+(Math.random()-.5)*1.1;break;
    case"B":a=Math.random()*6.283;break;
    case"S":f.sw=(f.sw||0)+.55;a=f.sw+(Math.random()-.5)*.3;break;
    default:x=w*(.22+Math.random()*.56);y=-10*sc;a=Math.PI/2+(Math.random()-.5)*.25;sp=st.spd*sc*(.3+Math.random()*.5);
  }
  f.parts.push({k,c:col,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,life:st.life*(.6+Math.random()*.6),z:st.size*(KMUL[k]||1)*sc*(.55+Math.random()*.7),a:.55+Math.random()*.4,ph:Math.random()*6.28,r:Math.random()*6.28,vr:(Math.random()-.5)*5,g:st.g*sc});
}
function star(c,x,y,r,n,col,rot){c.fillStyle=col;c.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,rr=i%2?r*(n===4?.22:.45):r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill()}
function drawP(c,p,q,light){
  const z=p.z,a=(1-q)*p.a,fi=Math.min(1,p.t*7);
  c.globalCompositeOperation=(!light&&(p.k==="spark"||p.k==="ember"||p.k==="flame"||p.k==="star"||p.k==="ring"))?"lighter":"source-over";
  switch(p.k){
  case"mist":case"smoke":case"fluff":{const s=z*(1+q*(p.k==="smoke"?2.4:1.6));c.globalAlpha=a*(p.k==="mist"?.55:.7)*fi;c.drawImage(sprite(p.c),p.x-s/2,p.y-s/2,s,s);break}
  case"ember":{c.globalAlpha=a*fi;c.drawImage(sprite(p.c),p.x-z,p.y-z,z*2,z*2);break}
  case"flame":{c.globalAlpha=a*fi;const s=z*(1-q*.5);c.save();c.translate(p.x,p.y);c.scale(.7,1.5);c.drawImage(sprite(p.c),-s/2,-s/2,s,s);c.restore();break}
  case"spark":{c.globalAlpha=a*(.5+.5*Math.sin(p.t*16+p.ph));star(c,p.x,p.y,z*.5,4,p.c,p.r);break}
  case"star":{c.globalAlpha=a*(.6+.4*Math.sin(p.t*10+p.ph));star(c,p.x,p.y,z*.5,5,p.c,p.r);break}
  case"shard":{c.globalAlpha=a*(.4+.6*Math.abs(Math.sin(p.t*9+p.ph)));c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.beginPath();c.moveTo(0,-z*.5);c.lineTo(z*.1,0);c.lineTo(0,z*.5);c.lineTo(-z*.1,0);c.closePath();c.fill();c.restore();break}
  case"petal":{c.globalAlpha=a*fi;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.scale(1,.55+.45*Math.abs(Math.sin(p.t*3+p.ph)));c.fillStyle=p.c;c.beginPath();c.moveTo(0,-z*.5);c.bezierCurveTo(z*.45,-z*.5,z*.45,z*.3,0,z*.5);c.bezierCurveTo(-z*.45,z*.3,-z*.45,-z*.5,0,-z*.5);c.fill();c.restore();break}
  case"leaf":{c.globalAlpha=a*fi;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.beginPath();c.moveTo(0,-z*.5);c.quadraticCurveTo(z*.35,0,0,z*.5);c.quadraticCurveTo(-z*.35,0,0,-z*.5);c.fill();c.restore();break}
  case"bubble":{c.globalAlpha=a*fi;c.strokeStyle=p.c;c.lineWidth=Math.max(1,z*.07);c.beginPath();c.arc(p.x,p.y,z*.5,0,6.283);c.stroke();c.globalAlpha=a*fi*.18;c.fillStyle=p.c;c.fill();c.globalAlpha=a*fi*.8;c.fillStyle="#ffffff";c.beginPath();c.arc(p.x-z*.17,p.y-z*.17,z*.07,0,6.283);c.fill();break}
  case"drop":{c.globalAlpha=a*fi;c.save();c.translate(p.x,p.y);c.rotate(Math.atan2(p.vy,p.vx));c.fillStyle=p.c;c.beginPath();c.ellipse(0,0,z*.5,z*.28,0,0,6.283);c.fill();c.restore();break}
  case"bean":{c.globalAlpha=a*fi;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.beginPath();c.ellipse(0,0,z*.5,z*.32,0,0,6.283);c.fill();c.strokeStyle="#e8d5bd";c.globalAlpha=a*fi*.6;c.lineWidth=Math.max(1,z*.06);c.beginPath();c.moveTo(-z*.4,0);c.quadraticCurveTo(0,z*.12,z*.4,0);c.stroke();c.restore();break}
  case"thread":{c.globalAlpha=a*fi;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.strokeStyle=p.c;c.lineWidth=Math.max(1.2,z*.07);c.lineCap="round";c.beginPath();c.moveTo(-z*.5,0);c.quadraticCurveTo(0,-z*.4*Math.sin(p.t*6+p.ph),z*.5,0);c.stroke();c.restore();break}
  case"ring":{c.globalAlpha=a*.8;c.strokeStyle=p.c;c.lineWidth=Math.max(1,z*.05);c.beginPath();c.arc(p.x,p.y,z*(.3+q*2),0,6.283);c.stroke();break}
  }
}
function drawFx(v,dt){
  const f=v.fx;if(!f)return;const c=v.ctx,P=f.parts,light=document.documentElement.dataset.theme==="light";
  if(f.emit>0){f.emit-=dt;f.acc+=f.st.rate*dt;while(f.acc>=1){f.acc--;if(P.length<260)spawn(v,light)}}
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.t+=dt;if(p.t>=p.life){P[i]=P[P.length-1];P.pop();continue}
    const sw=(p.k==="smoke"||p.k==="fluff"||p.k==="mist"||p.k==="leaf"||p.k==="petal")?1:0,dr=Math.min(1,dt*(sw?1.4:.6)),sc=v.pw/360;
    p.vx-=p.vx*dr;p.vy-=p.vy*dr;p.vy+=p.g*dt;
    p.x+=p.vx*dt+(sw?Math.sin(p.t*3+p.ph)*16*sc*dt:0);p.y+=p.vy*dt;p.r+=p.vr*dt;
    drawP(c,p,p.t/p.life,light);
  }
  c.globalAlpha=1;c.globalCompositeOperation="source-over";
  if(!P.length&&f.emit<=0)v.fx=null;
}
let AC=null;
function psst(){
  if(!soundOn)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    const len=Math.floor(AC.sampleRate*.5),buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.2);
    const s=AC.createBufferSource();s.buffer=buf;const hp=AC.createBiquadFilter();hp.type="highpass";hp.frequency.value=2800;
    const g=AC.createGain();g.gain.value=.08;s.connect(hp);hp.connect(g);g.connect(AC.destination);s.start()}catch(e){}
}
function spray(v,quiet){
  if(!v||!v.group||!v.vis)return;
  const st=STY[(v.spec.si||0)%STY.length];
  v.fx={st,emit:st.dur,acc:0,parts:[],sw:Math.random()*6};v.pump=1;
  v.el.style.setProperty("--ac",st.col[0]+"66");v.el.classList.add("sprayed");
  v.lab.textContent=st.nm[LI()];v.lab.classList.add("show");
  clearTimeout(v.tm);v.tm=setTimeout(()=>{v.el.classList.remove("sprayed");v.lab.classList.remove("show")},2800);
  if(!quiet){psst();try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}}
  if(v.opt.onSpray)v.opt.onSpray(v);
}
function lightNotes(card){
  const rows=[...card.querySelectorAll(".notes div")];(card._tm||[]).forEach(clearTimeout);
  rows.forEach(r=>r.classList.remove("lit"));
  card._tm=rows.map((r,i)=>setTimeout(()=>r.classList.add("lit"),150+i*1500));
  card._tm.push(setTimeout(()=>rows.forEach(r=>r.classList.remove("lit")),6500));
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05);last=now;const time=now/1000;
  pts.rotation.y=time*.12;pts.position.y=Math.sin(time*.6)*.06;
  for(const v of (modal?[modal]:VIEWS)){
    if(!v.vis||!v.group||!v.pw)continue;
    if(v.leaving){v.app-=dt*3.2;v.vel=9;if(v.app<=0){v.app=0;v.leaving=false;v.opt.onSwap(v)}}
    else if(v.app<1)v.app=Math.min(1,v.app+dt*1.4);
    if(!v.drag)v.vel+=((reduce?0:.55)-v.vel)*Math.min(1,dt*2);
    v.rot+=v.vel*dt;
    v.sm+=(v.hx-v.sm)*Math.min(1,dt*6);v.smy+=(v.hy-v.smy)*Math.min(1,dt*6);
    const g=v.group;g.visible=true;v.pump=Math.max(0,v.pump-dt*2.4);const pu=v.pump;
    g.rotation.y=v.rot+v.sm*.9;g.rotation.x=v.smy*.14;g.rotation.z=Math.sin(time*46)*.025*pu;
    g.position.y=Math.sin(time*1.2+v.rot*.1)*.04-.07*pu;
    g.scale.setScalar(v.base*Math.max(.0001,easeOutBack(v.app)));
    cam.aspect=v.pw/v.ph;cam.updateProjectionMatrix();
    renderer.setViewport(0,0,v.pw,v.ph);renderer.setScissor(0,0,v.pw,v.ph);
    renderer.render(scene,cam);
    v.ctx.clearRect(0,0,v.pw,v.ph);v.ctx.drawImage(GLC,0,GH-v.ph,v.pw,v.ph,0,0,v.pw,v.ph);drawFx(v,dt);
    g.visible=false;
  }
}

/* ------------------------------------------------------------------ UI */
const HERO=[0,2,5,8,10,16,6,22];
let heroIdx=0;
const heroView=mkView($("#heroView"),F[HERO[0]],{hero:true,onSwap(v){
  heroIdx=(heroIdx+1)%HERO.length;v.spec=F[HERO[heroIdx]];v.group=getGroup(v.spec);v.base=v.group.userData.base;capHero();setTimeout(()=>{if(heroView.vis&&!modal)spray(heroView,true)},1100)}});
function capHero(){const f=F[HERO[heroIdx]];$("#heroCap").innerHTML=(f.b?f.b+" ":"")+f.n+"<small>"+t("drag")+"</small>"}
setInterval(()=>{if(!modal&&!heroView.drag&&heroView.vis&&!document.hidden)heroView.leaving=true},5200);
capHero();

$("#heroSpray").onclick=()=>spray(heroView);
setTimeout(()=>spray(heroView,true),1700);
$("#snd").onclick=e=>{soundOn=!soundOn;e.currentTarget.classList.toggle("off",!soundOn)};
$("#mq").innerHTML=[...MARQ,...MARQ].map(x=>x+" <i>✦</i> ").join("");

const grid=$("#grid"),chips=$("#chips");
const brandCount={};F.forEach(f=>{if(f.b)brandCount[f.b]=(brandCount[f.b]||0)+1});
const brands=Object.keys(brandCount).filter(b=>brandCount[b]>1);
let curBrand="*";
function renderChips(){
  chips.innerHTML="";
  const mk=(k,label)=>{const b=document.createElement("button");b.textContent=label;if(curBrand===k)b.className="on";
    b.onclick=()=>{curBrand=k;renderChips();filterCards()};chips.appendChild(b)};
  mk("*",t("all"));brands.forEach(b=>mk(b,b));
}
function filterCards(){document.querySelectorAll(".card").forEach(c=>{
  c.classList.toggle("hide",!(curBrand==="*"||c.dataset.b===curBrand))})}
F.forEach((f,i)=>{
  const c=document.createElement("article");c.className="card";c.dataset.b=f.b;
  c.innerHTML=`<div class="vwrap"><div class="view"><span class="tag">${i+1}</span><span class="drag" data-i="drag"></span></div>
    <button class="sprayBtn">${ICON}<span data-i="spray"></span></button></div>
  <div class="info">
    <div><em>${f.b||"ESSA Parfume"}</em><h3>${f.n}</h3></div>
    <p class="desc" data-d="${i}"></p>
    <dl class="notes">
      ${["top","mid","base"].map((k,j)=>`<div><dt data-i="${k}"></dt><dd>${f.N[j].map(n=>`<span data-k="${n}"></span>`).join("")}</dd></div>`).join("")}
    </dl>
    <p class="orig"><b data-i="origL"></b><span data-o="${f.o}"></span></p>
    <table><thead><tr><th data-i="vol"></th><th data-i="price"></th></tr></thead><tbody>
      ${[10,20,30].map((ml,j)=>`<tr><td>${ml} ml</td><td>${money(f.P[j])} <span data-i="som"></span></td></tr>`).join("")}
    </tbody></table>
  </div>`;
  grid.appendChild(c);
  const v=mkView(c.querySelector(".view"),f,{onSpray:()=>lightNotes(c)});
  c.querySelector(".sprayBtn").onclick=()=>spray(v);
});
/* pre-build + pre-compile bottles in the background, one at a time, so scrolling never stalls */
(function idle(i){if(i>=F.length)return;warm(F[i]);setTimeout(()=>idle(i+1),70)})(0);
setTimeout(()=>{},0);

const list=$("#list"),q=$("#q");
function genSpec(name,i){
  let h=0;for(let k=0;k<name.length;k++)h=(h*31+name.charCodeAt(k)+i)>>>0;
  const liq=["#c47a2c","#2f6f8a","#6b2e4a","#d9b46a","#3c5a3a","#b04a4a","#d9d3c7","#2a1a12","#e0a1b0","#5b4a8a","#8a5a2b","#9ab7a6"];
  const caps=["#111111","#d1a85a","#c0c4cc","#15130f"];
  const types=["box","box","cyl","disc","box","cyl"];
  return {t:types[h%types.length],l:liq[(h>>3)%liq.length],c:caps[(h>>6)%caps.length],lab:["",name],lb:["#f7f5f0","#101010","#efe6cf"][h%3],si:(h>>2)%STY.length};
}
function renderList(){
  const s=q.value.trim().toLowerCase();let n=0;const frag=document.createDocumentFragment();
  FULL.forEach((name,i)=>{if(s&&!name.toLowerCase().includes(s))return;n++;
    const b=document.createElement("button");b.innerHTML=`<b>${i+1}</b><span></span>`;b.lastChild.textContent=name;
    b.onclick=()=>openModal(name,i);frag.appendChild(b)});
  list.innerHTML="";list.appendChild(frag);
  $("#count").textContent=s?n+" "+t("res"):"";
  if(!n)list.innerHTML=`<div class="none">${t("none")}</div>`;
}
let qt;q.addEventListener("input",()=>{clearTimeout(qt);qt=setTimeout(renderList,120)});

let mInfo=null;
function countryOf(name){const u=name.toUpperCase();for(const[k,c]of CTRY)if(u.includes(k))return c;return null}
function setModalInfo(){
  if(!modal||!mInfo)return;const li=LI(),cc=countryOf(mInfo.name),parts=[];
  if(cc)parts.push(`<b>${t("homeL")}</b>${CNAME[cc][li]}`);
  parts.push(`<b>${t("styleL")}</b>${STY[modal.spec.si].nm[li]}`);
  const el=$("#mcountry");el.innerHTML=parts.join("");el.hidden=false;
}
function openModal(name,i){
  $("#mno").textContent=t("no")+" "+(i+1);$("#mname").textContent=name;
  $("#modal").classList.add("open");document.body.classList.add("modal-open");
  modal=mkView($("#mview"),genSpec(name,i),{hero:true,nocache:true});
  mInfo={name};setModalInfo();
  setTimeout(()=>{if(modal)spray(modal,true)},900);
}
function closeModal(){
  $("#modal").classList.remove("open");document.body.classList.remove("modal-open");
  if(modal){const m=modal;modal=null;destroyView(m)}
}
$("#mclose").onclick=closeModal;
$("#mspray").onclick=()=>modal&&spray(modal);
document.querySelectorAll(".ic").forEach(e=>e.innerHTML=ICON);
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

function updTexts(){
  document.querySelectorAll("[data-d]").forEach(e=>e.textContent=DESC[lang][+e.dataset.d]);
  document.querySelectorAll("[data-o]").forEach(e=>{const o=ORG[e.dataset.o];e.textContent=o?o[LI()]:""});
  setModalInfo();
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-ip]").forEach(e=>e.placeholder=t(e.dataset.ip));
  document.querySelectorAll("[data-k]").forEach(e=>e.textContent=tn(e.dataset.k));
  $("#fullS").textContent=t("fullS").replace("{n}",FULL.length);
  document.querySelectorAll("#langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  renderChips();renderList();capHero();updTexts();
}
document.querySelectorAll("#langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang()});
$("#theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark"};
if(matchMedia("(prefers-color-scheme:light)").matches)document.documentElement.dataset.theme="light";

applyLang();
requestAnimationFrame(frame);
</script>
